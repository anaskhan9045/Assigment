<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-areas:
    "header header"
    "sidebar products";
  gap: 20px;
  padding: 20px;
}

.header {
  grid-area: header;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: #2563eb;
  color: white;
  padding: 20px;
  border-radius: 8px;
}

.header h1 {
  margin: 0;
}

.header input {
  width: min(300px, 100%);
  padding: 10px;
  border: 0;
  border-radius: 5px;
}

.sidebar {
  grid-area: sidebar;
  background: white;
  padding: 20px;
  border-radius: 8px;
}

.sidebar a {
  display: block;
  margin: 15px 0;
  color: #333;
  text-decoration: none;
}

.products {
  grid-area: products;
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  align-content: start;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 8px #00000010;
}

.product img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 5px;
}

.product h3 {
  font-size: 18px;
}

.product p {
  color: #2563eb;
  font-weight: bold;
}

.product button {
  width: 100%;
  padding: 10px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

/* Responsive layout */
@media (max-width: 700px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "sidebar"
      "products";
    padding: 12px;
  }

  .header {
    flex-wrap: wrap;
  }

  .sidebar {
    padding: 12px;
  }

  .sidebar a {
    display: inline-block;
    margin: 8px;
  }
}

    </style>
</head>
<body>
    
<div class="layout">
  <header class="header">
    <h1>ShopZone</h1>
    <input type="search" placeholder="Search products..." />
  </header>

  <aside class="sidebar">
    <h2>Categories</h2>
    <a href="#">Electronics</a>
    <a href="#">Clothing</a>
    <a href="#">Accessories</a>
    <a href="#">Home</a>
  </aside>

  <main class="products">
    <article class="product">
      <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones" />
      <h3>Wireless Headphones</h3>
      <p>$49.99</p>
      <button>Add to Cart</button>
    </article>

    <article class="product">
      <img src="https://placehold.co/300x200?text=Watch" alt="Smart watch" />
      <h3>Smart Watch</h3>
      <p>$79.99</p>
      <button>Add to Cart</button>
    </article>

    <article class="product">
      <img src="https://placehold.co/300x200?text=Shoes" alt="Running shoes" />
      <h3>Running Shoes</h3>
      <p>$59.99</p>
      <button>Add to Cart</button>
    </article>

    <article class="product">
      <img src="https://placehold.co/300x200?text=Backpack" alt="Backpack" />
      <h3>Travel Backpack</h3>
      <p>$39.99</p>
      <button>Add to Cart</button>
    </article>
  </main>
</div>

</body>
</html>
