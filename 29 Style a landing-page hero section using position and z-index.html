
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Hero</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        /* Navigation bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #ffffff;
            position: relative;
            z-index: 10;
        }

        nav h2 {
            margin: 0;
            color: #1e3a8a;
        }

        nav a {
            color: #334155;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Hero section */
        .hero {
            position: relative;
            min-height: 480px;
            padding: 100px 8%;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            overflow: hidden;
            isolation: isolate;
        }

        /* Decorative circle behind the text */
        .circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #93c5fd;
            top: 60px;
            right: 10%;
            z-index: -1;
        }

        /* Hero content */
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 550px;
        }

        .hero h1 {
            font-size: 44px;
            color: #1e3a8a;
            margin: 0 0 20px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.7;
            color: #475569;
        }

        .hero button {
            margin-top: 15px;
            padding: 14px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .hero button:hover {
            background: #1d4ed8;
        }

        /* Floating badge */
        .badge {
            position: absolute;
            right: 12%;
            bottom: 55px;
            z-index: 2;
            padding: 14px 20px;
            background: white;
            color: #1e3a8a;
            border-radius: 10px;
            box-shadow: 0 5px 18px #00000020;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            nav {
                padding: 18px;
                flex-wrap: wrap;
                gap: 12px;
            }

            nav a {
                margin-left: 8px;
            }

            .hero {
                padding: 70px 24px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .circle {
                width: 180px;
                height: 180px;
                right: -40px;
                top: 230px;
            }

            .badge {
                position: relative;
                display: inline-block;
                right: auto;
                bottom: auto;
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>WebStart</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">

        <div class="circle"></div>

        <div class="hero-content">
            <h1>Build Something Amazing</h1>

            <p>
                Create beautiful websites with modern design,
                clean layouts, and responsive user experiences.
            </p>

            <button type="button">Get Started</button>
        </div>

        <div class="badge">
            Modern &amp; Responsive
        </div>

    </section>

</body>
</html>
