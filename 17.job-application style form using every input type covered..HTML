
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>
    <p>Please fill in your details below.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Create Password:</label>
            <input type="password" id="password" name="password">
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="time">Preferred Interview Time:</label>
            <input type="time" id="time" name="time">
            <br><br>

            <label for="website">Portfolio Website:</label>
            <input type="url" id="website" name="website">
            <br><br>
        </fieldset>

        <fieldset>
            <legend>Job Details</legend>

            <label for="position">Position Applied For:</label>
            <select id="position" name="position" required>
                <option value="">Select Position</option>
                <option value="developer">Web Developer</option>
                <option value="designer">Web Designer</option>
                <option value="manager">Project Manager</option>
                <option value="intern">Intern</option>
            </select>
            <br><br>

            <label>Employment Type:</label>
            <input type="radio" id="fulltime" name="employment" value="Full-time">
            <label for="fulltime">Full-time</label>

            <input type="radio" id="parttime" name="employment" value="Part-time">
            <label for="parttime">Part-time</label>

            <input type="radio" id="internship" name="employment" value="Internship">
            <label for="internship">Internship</label>
            <br><br>

            <label for="experience">Years of Experience:</label>
            <input type="number" id="experience" name="experience" min="0" max="50">
            <br><br>

            <label for="salary">Expected Salary (₹):</label>
            <input type="range" id="salary" name="salary"
                   min="10000" max="100000" step="5000" value="30000">
            <br><br>

            <label for="color">Choose Your Preferred Theme Color:</label>
            <input type="color" id="color" name="color">
            <br><br>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            <br><br>

            <label for="linkedin">LinkedIn Profile:</label>
            <input type="url" id="linkedin" name="linkedin">
            <br><br>
        </fieldset>

        <fieldset>
            <legend>Skills and Availability</legend>

            <p>Select your skills:</p>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js">JavaScript</label>
            <br><br>

            <label for="startdate">Available Start Date:</label>
            <input type="date" id="startdate" name="startdate">
            <br><br>

            <label for="message">Why should we hire you?</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="40"
                      placeholder="Describe your skills and experience..."></textarea>
            <br><br>

            <input type="hidden" name="formType" value="jobApplication">
        </fieldset>

        <br>

        <input type="checkbox" id="declaration" name="declaration" required>
        <label for="declaration">
            I confirm that the information provided is correct.
        </label>
        <br><br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Clear Form">
        <br><br>

        <button type="button" onclick="window.print()">
            Print Form
        </button>

    </form>

</body>
</html>
