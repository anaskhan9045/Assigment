
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Component</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
        }

        .profile-card {
            width: 100%;
            max-width: 340px;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
        }

        .card-header {
            height: 110px;
            background: linear-gradient(135deg, #2563eb, #0f766e);
        }

        .profile-image {
            width: 110px;
            height: 110px;
            margin: -55px auto 15px;
            border: 5px solid #ffffff;
            border-radius: 50%;
            background-color: #dbeafe;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
        }

        .card-content {
            padding: 0 25px 25px;
        }

        .card-content h1 {
            margin: 5px 0;
            font-size: 24px;
            color: #1e293b;
        }

        .role {
            color: #2563eb;
            font-weight: bold;
            margin: 5px 0 15px;
        }

        .description {
            font-size: 14px;
            line-height: 1.7;
            color: #64748b;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 18px 0;
            margin: 20px 0;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat strong {
            display: block;
            font-size: 19px;
            color: #1e293b;
        }

        .stat span {
            font-size: 12px;
            color: #64748b;
        }

        .profile-button {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-button:hover {
            background-color: #1d4ed8;
        }

        .profile-button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <article class="profile-card">

        <div class="card-header"></div>

        <div class="profile-image" aria-hidden="true">
            👨‍💻
        </div>

        <div class="card-content">
            <h1>Your Name</h1>
            <p class="role">Web Developer</p>

            <p class="description">
                Passionate about designing clean, responsive websites
                and creating useful digital experiences.
            </p>

            <div class="stats">
                <div class="stat">
                    <strong>12</strong>
                    <span>Projects</span>
                </div>

                <div class="stat">
                    <strong>8</strong>
                    <span>Skills</span>
                </div>

                <div class="stat">
                    <strong>2</strong>
                    <span>Years</span>
                </div>
            </div>

            <button class="profile-button" type="button">
                View Profile
            </button>
        </div>

    </article>

</body>
</html>
